name: Build Esprit Leger APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect project archive
        id: archive
        shell: bash
        run: |
          if [ -f EspritLibreAndroid_V5.zip ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Archive not uploaded yet; nothing to build."
          fi

      - name: Set up Java
        if: steps.archive.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.archive.outputs.present == 'true'
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        if: steps.archive.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android platform
        if: steps.archive.outputs.present == 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Extract project
        if: steps.archive.outputs.present == 'true'
        run: unzip -q EspritLibreAndroid_V5.zip -d extracted

      - name: Apply V6 base fixes
        if: steps.archive.outputs.present == 'true'
        run: python3 tools/patch_v6.py extracted/EspritLibreAndroid

      - name: Install icon patch dependency
        if: steps.archive.outputs.present == 'true'
        run: python3 -m pip install --quiet pillow

      - name: Apply V6.1 fixes
        if: steps.archive.outputs.present == 'true'
        run: python3 tools/patch_v61.py extracted/EspritLibreAndroid

      - name: Apply V6.2 fixes
        if: steps.archive.outputs.present == 'true'
        run: python3 tools/patch_v62.py extracted/EspritLibreAndroid

      - name: Apply V6.2 persistence fix
        if: steps.archive.outputs.present == 'true'
        run: python3 tools/patch_v62_state.py extracted/EspritLibreAndroid

      - name: Apply V6.3 fixes
        if: steps.archive.outputs.present == 'true'
        run: python3 tools/patch_v63.py extracted/EspritLibreAndroid

      - name: Apply V6.4 fixes
        if: steps.archive.outputs.present == 'true'
        run: python3 tools/patch_v64.py extracted/EspritLibreAndroid

      - name: Apply V6.5 stability and AI fixes
        if: steps.archive.outputs.present == 'true'
        run: python3 tools/patch_v65.py extracted/EspritLibreAndroid

      - name: Remove signing config until GitHub secret is configured
        if: steps.archive.outputs.present == 'true'
        run: python3 tools/patch_v65_nosign.py extracted/EspritLibreAndroid

      - name: Apply V6.6 native notification fixes
        if: steps.archive.outputs.present == 'true'
        run: python3 tools/patch_v66.py extracted/EspritLibreAndroid

      - name: Apply V6.7 fluid navigation and free analysis
        if: steps.archive.outputs.present == 'true'
        run: python3 tools/patch_v67.py extracted/EspritLibreAndroid

      - name: Apply V6.8 stable system bars and automatic free advice
        if: steps.archive.outputs.present == 'true'
        run: python3 tools/patch_v68.py extracted/EspritLibreAndroid

      - name: Apply V6.9 free AI restrictions
        if: steps.archive.outputs.present == 'true'
        run: python3 tools/patch_v69.py extracted/EspritLibreAndroid

      - name: Apply V6.10 rollback and safe-area fix
        if: steps.archive.outputs.present == 'true'
        run: python3 tools/patch_v610.py extracted/EspritLibreAndroid

      - name: Apply V6.11 unified swipe stability fix
        if: steps.archive.outputs.present == 'true'
        run: python3 tools/patch_v611.py extracted/EspritLibreAndroid

      - name: Apply V6.12 raised tabs and Premium AI restoration
        if: steps.archive.outputs.present == 'true'
        run: python3 tools/patch_v612.py extracted/EspritLibreAndroid

      - name: Apply V6.13 raised bottom navigation
        if: steps.archive.outputs.present == 'true'
        run: python3 tools/patch_v613.py extracted/EspritLibreAndroid

      - name: Build debug APK
        if: steps.archive.outputs.present == 'true'
        working-directory: extracted/EspritLibreAndroid
        run: gradle assembleDebug

      - name: Upload APK
        if: steps.archive.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: esprit-leger-v6-13-dev-apk
          path: extracted/EspritLibreAndroid/app/build/outputs/apk/debug/app-debug.apk
