name: Build Esprit Leger APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect project archive
        id: archive
        shell: bash
        run: |
          if [ -f EspritLibreAndroid_V5.zip ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Archive not uploaded yet; nothing to build."
          fi

      - name: Set up Java
        if: steps.archive.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.archive.outputs.present == 'true'
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        if: steps.archive.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android platform
        if: steps.archive.outputs.present == 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Extract project
        if: steps.archive.outputs.present == 'true'
        run: unzip -q EspritLibreAndroid_V5.zip -d extracted

      - name: Fix Android app name resource
        if: steps.archive.outputs.present == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('extracted/EspritLibreAndroid/app/src/main/res/values/strings.xml')
          s = p.read_text(encoding='utf-8')
          s = s.replace("L'Esprit Léger", "L\\'Esprit Léger")
          p.write_text(s, encoding='utf-8')
          print(p.read_text(encoding='utf-8'))
          PY

      - name: Build debug APK
        if: steps.archive.outputs.present == 'true'
        working-directory: extracted/EspritLibreAndroid
        run: gradle assembleDebug

      - name: Upload APK
        if: steps.archive.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: esprit-leger-v5-apk
          path: extracted/EspritLibreAndroid/app/build/outputs/apk/debug/app-debug.apk
