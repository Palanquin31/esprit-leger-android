name: Build Esprit Leger APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    if: ${{ hashFiles('EspritLibreAndroid_V5.zip') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Extract project
        run: unzip -q EspritLibreAndroid_V5.zip -d extracted

      - name: Build debug APK
        working-directory: extracted/EspritLibreAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: esprit-leger-v5-apk
          path: extracted/EspritLibreAndroid/app/build/outputs/apk/debug/app-debug.apk
