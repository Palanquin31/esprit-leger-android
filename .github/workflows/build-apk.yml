name: Build Esprit Leger APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect project archive
        id: archive
        shell: bash
        run: |
          if [ -f EspritLibreAndroid_V5.zip ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Archive not uploaded yet; nothing to build."
          fi

      - name: Set up Java
        if: steps.archive.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.archive.outputs.present == 'true'
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        if: steps.archive.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android platform
        if: steps.archive.outputs.present == 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Extract project
        if: steps.archive.outputs.present == 'true'
        run: unzip -q EspritLibreAndroid_V5.zip -d extracted

      - name: Apply V6 base fixes
        if: steps.archive.outputs.present == 'true'
        run: python3 tools/patch_v6.py extracted/EspritLibreAndroid

      - name: Install icon patch dependency
        if: steps.archive.outputs.present == 'true'
        run: python3 -m pip install --quiet pillow

      - name: Apply V6.1 fixes
        if: steps.archive.outputs.present == 'true'
        run: python3 tools/patch_v61.py extracted/EspritLibreAndroid

      - name: Apply V6.2 fixes
        if: steps.archive.outputs.present == 'true'
        run: python3 tools/patch_v62.py extracted/EspritLibreAndroid

      - name: Build debug APK
        if: steps.archive.outputs.present == 'true'
        working-directory: extracted/EspritLibreAndroid
        run: gradle assembleDebug

      - name: Upload APK
        if: steps.archive.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: esprit-leger-v6-2-dev-apk
          path: extracted/EspritLibreAndroid/app/build/outputs/apk/debug/app-debug.apk
